name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Cache FastEmbed models
        uses: actions/cache@v3
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            fastembed-

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v

      - name: Run SQLite E2E tests
        run: uv run pytest tests/e2e_sqlite/ -v

      - name: Run linting
        run: uv tool run ruff check .

  smoke-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for hatch-vcs version detection
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel
        run: uv build

      - name: Verify alembic files in wheel
        run: |
          WHEEL=$(ls dist/*.whl)
          echo "Checking wheel contents for alembic files..."
          if unzip -l "$WHEEL" | grep -q "alembic"; then
            echo "✓ Alembic files found in wheel"
          else
            echo "✗ Alembic files missing from wheel!"
            exit 1
          fi

      - name: Test installation and CLI works
        run: |
          WHEEL=$(ls dist/*.whl)
          echo "Testing installation from wheel: $WHEEL"

          # Test that CLI command works
          uvx --from "$WHEEL" forgetful --help
          echo "✓ CLI command works"

          echo "✓ Smoke test passed - wheel installs correctly with all dependencies"

  docker-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker with attestation storage
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Build candidate image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          provenance: mode=max
          tags: forgetful:offline-test
          build-args: VERSION=0.0.0+dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify offline startup, search, restart and recreation
        env:
          FORGETFUL_TEST_IMAGE: forgetful:offline-test
          FORGETFUL_TEST_VERSION: 0.0.0+dev
        run: uv run --frozen --no-dev pytest tests/docker/ -v
