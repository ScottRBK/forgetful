name: PostgreSQL test suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Install PostgreSQL backup tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          pg_dump --version
          psql --version

      - name: Cache FastEmbed models
        uses: actions/cache@v3
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            fastembed-

      - name: Run E2E tests
        run: uv run --frozen pytest tests/e2e/ -v -m e2e
