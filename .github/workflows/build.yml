name: Build

on:
  push:
    tags:
      - 'v*'

# Do not interrupt publication halfway through updating the release tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Reviewed 2026-10-10: v5.5.0, 2bf61fb9464cc67f0cbdeabed6aa0380accd1c70.
      # Public repository security page listed no advisories; future v5 updates may differ.
      - name: Set up Docker with attestation storage
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The docker driver stores both image and attestations locally without --load.
          driver: docker

      - name: Install uv for the regression test
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Lowercase repository owner
        id: repo
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/forgetful
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build release candidate locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record candidate image identity
        id: candidate
        env:
          IMAGE: ghcr.io/${{ steps.repo.outputs.owner }}/forgetful:${{ steps.meta.outputs.version }}
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Verify version and offline startup, search, restart and recreation
        env:
          FORGETFUL_TEST_IMAGE: ${{ steps.candidate.outputs.image_id }}
          FORGETFUL_TEST_VERSION: ${{ steps.meta.outputs.version }}
        run: uv run --frozen --no-dev pytest tests/docker/ -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image with its attestations
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          TESTED_IMAGE_ID: ${{ steps.candidate.outputs.image_id }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$TESTED_IMAGE_ID"
            docker push "$tag"
          done <<< "$TAGS"
