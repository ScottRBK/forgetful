[project]
name = "forgetful-ai"
dynamic = ["version"]
description = "MCP Server for AI Agent Memory - persistent, semantically-searchable memory for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Scott", email = "scott@example.com"}]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "dotenv==0.9.9",
    "fastapi==0.136.3",
    "fastembed==0.8.0",
    "fastmcp==3.2.2",
    "google-genai==1.66.0",
    "httpx==0.28.1",
    "ollama==0.6.1",
    "openai==2.20.0",
    "pgvector==0.4.2",
    "platformdirs==4.7.0",
    "psycopg2-binary==2.9.11",
    "py-key-value-aio[filetree]==0.4.4",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "requests==2.33.0",
    "sqlalchemy[asyncio]==2.0.46",
    "sqlite-vec==0.1.6",
    "starlette==1.3.1",
    "tiktoken==0.12.0",
    "uvicorn==0.40.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.4"]

[dependency-groups]
dev = [
    "bandit[toml]==1.9.4",
    "coverage[toml]==7.16.2",
    "grimp==3.17",
    "import-linter==2.15",
    "memray>=1.20.0 ; sys_platform != 'win32'",
    "mutmut==3.8.0",
    "mypy==2.4.0",
    "pylint==4.1.3",
    "pytest-cov==7.1.0",
    "pytest-memray>=1.11.0 ; sys_platform != 'win32'",
    "radon==6.0.1",
    "ruff==0.17.1",
    "syrupy==6.1.1",
    "vulture==2.16",
]
# Dev-only: drives the UAT walkthrough container; agent-shell-py lives in the
# container image (test_harness/docker/Dockerfile), not on the host.
harness = ["docker>=7.1.0"]

[project.urls]
Homepage = "https://github.com/scottrbk/forgetful"
Repository = "https://github.com/scottrbk/forgetful"
Issues = "https://github.com/scottrbk/forgetful/issues"

[project.scripts]
forgetful = "main:cli"
forgetful-ai = "main:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "app/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["app", "main.py"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "alembic.ini"
"alembic" = "alembic"

[tool.hatch.build.targets.sdist]
include = ["app", "main.py", "alembic.ini", "alembic/", "README.md", "LICENSE"]

[tool.importlinter]
root_package = "app"
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "foundation"
name = "Models, contracts and shared support stay independent"
type = "forbidden"
source_modules = [
    "app.models", "app.protocols", "app.events", "app.utils",
    "app.config.settings", "app.config.logging_config",
    "app.middleware.logging_middleware", "app.exceptions", "app.version",
]
forbidden_modules = [
    "app.services", "app.repositories", "app.routes", "app.bootstrap",
    "app.middleware.auth", "app.config.auth", "app.config.write_plugin",
]

[[tool.importlinter.contracts]]
id = "services"
name = "Services use contracts instead of integrations or entry points"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = [
    "app.repositories", "app.routes", "app.bootstrap",
    "app.middleware.auth", "app.config.auth", "app.config.write_plugin",
]

[[tool.importlinter.contracts]]
id = "repositories"
name = "Repositories stay independent of workflows and entry points"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = [
    "app.services", "app.routes", "app.bootstrap",
    "app.middleware.auth", "app.config.auth", "app.config.write_plugin",
]

[[tool.importlinter.contracts]]
id = "external"
name = "Core code stays independent of database, provider and backup integrations"
type = "forbidden"
source_modules = [
    "app.models", "app.protocols", "app.services", "app.events", "app.utils",
    "app.config.settings", "app.config.logging_config",
    "app.middleware.logging_middleware", "app.exceptions", "app.version",
]
forbidden_modules = [
    "sqlalchemy", "openai", "google", "fastembed", "httpx", "ollama",
    "subprocess", "shutil",
]

[[tool.importlinter.contracts]]
id = "routes"
name = "HTTP and MCP handlers use services instead of repositories or bootstrap"
type = "forbidden"
source_modules = [
    "app.routes.api", "app.routes.mcp", "app.routes.write_plugin_responses", "app.middleware.auth",
]
forbidden_modules = ["app.repositories", "app.bootstrap", "app.config.write_plugin"]

# Keep CLI startup exceptions separate so HTTP/MCP cannot use them to reach bootstrap.
[[tool.importlinter.contracts]]
id = "cli"
name = "CLI uses services with explicit startup wiring"
type = "forbidden"
source_modules = ["app.routes.cli"]
forbidden_modules = ["app.repositories", "app.bootstrap", "app.config.write_plugin"]
ignore_imports = [
    "app.routes.cli.local_executor -> app.bootstrap",
    "app.routes.cli.context -> app.bootstrap",
]

# ---------------------------------------------------------------------------
# Quality gates. Orchestrated by scripts/quality (python -m scripts.quality) (see docs/quality-gates.md);
# Git hooks live in .githooks/ and are installed with `uv run python -m scripts.quality install`.
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["app", "main"]
branch = true
relative_files = true
parallel = true
# SQLAlchemy's async layer runs sync code in greenlets; aiosqlite uses threads.
concurrency = ["greenlet", "thread"]
patch = ["subprocess"]
omit = ["*/_version.py"]

[tool.coverage.report]
# Ratchet: floor of the combined SQLite + PostgreSQL line and branch coverage measured when the
# gates were introduced (78.4 to 78.5 % over repeated runs). Raise it with the code, never lower
# it; the target is 100.
fail_under = 78
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@(typing\\.)?overload",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "if __name__ == .__main__.:",
]

[tool.coverage.paths]
source = ["app", "*/app"]

[tool.mypy]
python_version = "3.12"
files = ["app", "main.py", "scripts"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = false
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["sqlite_vec.*", "fastembed.*", "pgvector.*", "tiktoken.*", "dotenv.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app._version"]  # generated by the build backend and git-ignored: absent on a fresh checkout
ignore_missing_imports = true

[tool.pylint.main]
jobs = 0
py-version = "3.12"
fail-under = 8.0
load-plugins = ["pylint.extensions.mccabe"]
ignore-paths = ["^app/_version\\.py$", "^alembic/"]  # migrations: generated style, and the directory shadows the alembic package

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-locals = 25
max-statements = 80
max-branches = 20
max-returns = 10
max-attributes = 12

[tool.pylint."messages control"]
# Style/noise categories only; correctness checks (E, most W, R) stay enabled.
disable = [
    "missing-module-docstring",    # docstring policy is not enforced in this repo (ruff D is off)
    "missing-class-docstring",
    "missing-function-docstring",
    "duplicate-code",              # SQLite and PostgreSQL repositories are intentionally parallel
    "too-few-public-methods",      # protocol/adapter/data classes
    "logging-fstring-interpolation",  # project-wide logging style
    "import-outside-toplevel",     # deliberate lazy imports (startup cost, optional providers)
]

[tool.bandit]
exclude_dirs = ["tests", "test_harness/runs", ".venv", ".venv314", ".gitnexus", "node_modules"]

[tool.vulture]
paths = ["app", "main.py", "alembic", "test_harness", "scripts", "vulture_whitelist.py"]
min_confidence = 60
exclude = ["app/_version.py", "test_harness/runs/", "alembic/versions/"]
# Decorators that register the decorated function with a framework: pydantic validators,
# FastMCP routes/tools and SQLAlchemy event listeners are called by the framework only.
ignore_decorators = [
    "@field_validator",
    "@model_validator",
    "@mcp.custom_route",
    "@mcp.tool",
    "@event.listens_for",
    "@_register",  # app.config.auth: registers the provider factory under its class path
]
# Names a framework or the migration loader reads by reflection.
ignore_names = [
    "model_config",  # pydantic / pydantic-settings class configuration
    "upgrade_postgres",  # called by alembic/versions/0c7b964dd1e7 (excluded above)
    "downgrade_postgres",
    "upgrade_sqlite",
    "downgrade_sqlite",
    "_missing_",  # enum.Enum hook, called by Enum lookup of unknown values
    "prepare",  # logging.handlers.QueueHandler hook, called by QueueHandler.emit
]

[tool.mutmut]
# Full-project mutation (~33k mutants) is impractical; scripts/quality scopes every run.
# The sandbox (mutants/) must contain everything the selected tests read from the repo root.
source_paths = ["app/"]
pytest_add_cli_args_test_selection = ["tests/architecture/", "tests/integration/"]
# Not mutated: the generated version file; the repositories (only reachable from the e2e suites,
# which are not part of the mutation test selection); and the 160 KB tool metadata table, a pure data
# module on which mutant generation takes hours.
do_not_mutate = [
    "app/_version.py", "app/repositories/*", "app/routes/mcp/tool_metadata_registry.py",
]
also_copy = [
    "alembic/", "alembic.ini", "pytest.ini", "main.py", "pyproject.toml", "ruff.toml",
    "test_harness/", "scripts/", "skills/", "docs/", "docker/", "architecture.md", "README.md",
]
# Modules that start Python child processes in other directories cannot run inside the mutmut
# sandbox (an instrumented app module needs mutmut's config at import time), so they are skipped.
pytest_add_cli_args = [
    "-p", "no:cacheprovider", "-q",
    "--ignore=tests/architecture/test_contracts.py",
    "--ignore=tests/integration/test_config_precedence.py",
    "--ignore=tests/integration/test_harness_walkthrough.py",
    "--ignore=tests/integration/test_quality_runner.py",
]
