[pytest]
pythonpath = .
testpaths = tests
markers =
    e2e: full end-to-end flow tests with real PostgreSQL
    integration: integration tests with stubbed dependencies
    asyncio: mark test as async
    snapshot: syrupy snapshot of a public surface (tool metadata, routes, CLI help, schema)
    memory: memray memory-budget test (run with --memray; Linux/macOS only)
    limit_memory: pytest-memray allocation budget for one test (inert without --memray)
addopts = -m "not e2e"
asyncio_mode = auto
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
